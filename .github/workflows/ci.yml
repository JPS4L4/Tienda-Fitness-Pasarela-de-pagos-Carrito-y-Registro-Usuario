name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # `next build` prerenders pages that read from the database (for example /plans),
    # so the build needs a real PostgreSQL. An ephemeral service container is used here;
    # the migrations are applied to it before building. No real secrets are involved.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tienda_fitness_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tienda_fitness_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy values: enough for the build to compile and prerender, never used against real services.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tienda_fitness_ci
      NEXTAUTH_SECRET: ci-only-nextauth-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_EMAILS: ci@example.com
      STRIPE_SECRET_KEY: sk_test_dummy_for_ci
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy_for_ci
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply migrations to the CI database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
